# fastcharge charging profile
#
# One rule per line, whitespace separated:
#
#     soc_lo soc_hi temp_lo temp_hi pdo_mv icl_ma
#
#   soc_lo/soc_hi   battery SoC window [lo, hi) in percent; per temperature
#                   band the rules must tile [0, 100] exactly
#   temp_lo/temp_hi battery temperature window [lo, hi) in degrees C;
#                   "-" and "+" mean unbounded (outermost rules), so the
#                   table covers the entire temperature axis
#   pdo_mv          fixed-PDO voltage 5000/9000/12000 (used verbatim with
#                   fixed-PD adapters; with PPS adapters the voltage is
#                   computed by the official vbat-tracking formula and only
#                   the current column applies)
#   icl_ma          adapter current limit, max 3000
#
# The grid follows the official OPLUS SM8850 charging strategy
# (vendor/oplus/kernel/charger/oplus_pps.c):
#   * temperature bands 0 / 5 / 12 / 20 / 35 / 44 / 51 C   (rang_temp_tmp)
#   * SoC breakpoints 15 / 30 / 50 / 75 / 85 / 95 %         (soc_tmp)
#   * warm band (44..51 C) charges only below 50 % SoC      (pps_warm_allow_soc)
#
# Safety properties (enforced by fastcharged independent of this file):
#   * hard caps 12000 mV / 3000 mA; PPS asks stay in [5500, 10500] mV
#     (official PPS_VOL_CURVE_LMAX / PPS_3RD_ASK_VOLT_MAX)
#   * the whole SoC x temperature domain must be covered exactly once;
#     a gap or overlap aborts the daemon and charging stays at 5 V
#   * lower-power rules apply immediately; stepping up in power needs the
#     new rule to hold for consecutive polls

# ---- below 0 C: trickle only ---------------------------------------------
0    100  -    0     5000  500

# ---- 0 .. 5 C: minimal ----------------------------------------------------
0    100  0    5     5000  1000

# ---- 5 .. 12 C: gentle ----------------------------------------------------
0    50   5    12    9000  1500
50   80   5    12    5000  1500
80   100  5    12    5000  1000

# ---- 12 .. 20 C ------------------------------------------------------------
0    50   12   20    9000  2000
50   75   12   20    9000  1500
75   90   12   20    5000  1500
90   100  12   20    5000  1000

# ---- 20 .. 35 C: full speed (12 V / 3 A below 50 % SoC) -------------------
0    50   20   35    12000 3000
50   75   20   35    12000 2000
75   85   20   35    9000  1500
85   95   20   35    5000  1500
95   100  20   35    5000  1000

# ---- 35 .. 44 C: derated along the official SoC grid ----------------------
0    15   35   44    12000 3000
15   30   35   44    12000 2500
30   50   35   44    12000 2000
50   75   35   44    9000  1500
75   90   35   44    5000  1500
90   100  35   44    5000  1000

# ---- 44 .. 51 C: warm, only below 50 % SoC (pps_warm_allow_soc) -----------
0    50   44   51    9000  2000
50   80   44   51    5000  1500
80   100  44   51    5000  1000

# ---- above 51 C: trickle (let the charger protect itself) -----------------
0    100  51   +     5000  500
