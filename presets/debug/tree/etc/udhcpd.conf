# udhcpd (busybox) config for the NCM gadget debug network.
# Same file as kernel/initrd_debug/etc/udhcpd.conf: the device side holds
# 192.168.42.42; the attached host gets an address from the pool below and
# can then reach telnet 192.168.42.42:23 (busybox root shell).
interface usb0
start    192.168.42.100
end      192.168.42.200
option subnet 255.255.255.0
option router 192.168.42.42
option dns    192.168.42.42
option lease  3600
lease_file /tmp/udhcpd.leases
pidfile    /tmp/udhcpd.pid
