# Use case configuration for the OnePlus Pad 4 (Qualcomm SM8850 "kaanapali",
# board "iceland"): qcom,kaanapali-sndcard, card driver "kaanapali",
# long name "OnePlus-Pad4".
#
# Audio paths (see arch/arm64/boot/dts/qcom/kaanapali-oneplus-iceland.dts and
# the audioreach topology qcom/kaanapali/OnePlus-Pad4-tplg.bin):
#   MultiMedia1 (hw:0,0) -> PRIMARY_MI2S_RX  -> 6x TFA9865      speakers
#   MultiMedia2 (hw:0,1) -> RX_CODEC_DMA_RX_0 -> rx-macro/WCD9395 headphones
#   MultiMedia3 (hw:0,2) <- TX_CODEC_DMA_TX_3 <- tx-macro/WCD9395 mics
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/kaanapali/OnePlus-Pad4-HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd939x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
