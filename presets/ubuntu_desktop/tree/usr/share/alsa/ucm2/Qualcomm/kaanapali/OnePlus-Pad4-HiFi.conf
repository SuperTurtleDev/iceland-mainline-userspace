# HiFi verb for the OnePlus Pad 4 (kaanapali / iceland).
#
# No headset-microphone device yet: it would share hw:0,2 with "Mic" and ACP
# drops a verb whose capture devices share a PCM without ConflictingDevice;
# the two-profile ConflictingDevice variant made WirePlumber latch onto the
# unavailable headset profile. Add it back once AMIC2/MIC BIAS is verified.

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Include.wcde.File "/codecs/wcd939x/DefaultEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

# The TFA9865 amplifiers expose no mixer controls: they are powered by DAPM
# while the MI2S stream runs. Volume stays in software (PipeWire).
SectionDevice."Speaker" {
	Comment "Speaker playback"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	Include.wcdhpe.File "/codecs/wcd939x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd939x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

# AMIC1 -> ADC1 -> TX SWR_INPUT0 (SWR_MIC0) -> DEC0 -> TX_AIF1_CAP. The PCM is
# stereo (DAI channels_min = 2, so no CaptureChannels 1 here); only the left
# slot carries DEC0, the right slot stays silent.
SectionDevice."Mic" {
	Comment "Internal microphone"

	Include.wcdmice.File "/codecs/wcd939x/AnalogMic1EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd939x/AnalogMicDisableSeq.conf"
	Include.txmmice.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmmicd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}

